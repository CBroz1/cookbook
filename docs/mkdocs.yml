site_name: Broz's Cookbook
site_url: https://CBroz1.github.io/cookbook/
site_description: Collection of adapted recipes
site_author: CBroz1

repo_url: https://github.com/CBroz1/cookbook
docs_dir: ./src/
edit_uri: blob/main/docs/src/

theme:
    name: material
    palette:
      - media: "(prefers-color-scheme: light)"
        scheme: my-default
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
    custom_dir: overrides
    logo: stylesheets/cook_icon.png
    favicon: stylesheets/cook_icon.png
    disable_nav_previous_next: true
    disable_nav_search: false
    navigation_depth: 2
    locale: en
    shortcuts:
        help:      72 # h # doesn't seem to be working
        next:      78 # n
        previous:  80 # p
        search:    83 # s
    features:
      - toc.integrate
      # navigation.sections renders top-level sections as always-open
      # groups, and navigation.expand opens every subsection. Both are
      # omitted so the sidebar starts fully collapsed.
      - navigation.top
      - navigation.instant   # saves loading time - 1 browser page
      - navigation.tracking  # even with above, changes URL by section
      - search.suggest
      - search.share

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - exclude:
      glob:
        - "temp*"
  - literate-nav:
      nav_file: navigation.md
  - exclude-search:
      exclude:
        - "navigation.md"
        - "*/navigation.md"

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra:
  generator: false # Disable watermark
