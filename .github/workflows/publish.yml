name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# gh-deploy force-pushes gh-pages. Two runs at once would race on that
# branch, so only the newest push for a ref is allowed to finish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-exclude mkdocs-exclude-search mkdocs-literate-nav
      - run: cd docs; mkdocs gh-deploy --force
